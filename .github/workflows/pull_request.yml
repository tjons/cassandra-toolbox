name: PR checks
run-name: Pull Request Checks
on:
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.26

      - name: Vet
        run: make vet

      - name: Test
        run: make test